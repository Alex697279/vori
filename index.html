<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALMS Test Player</title>
</head>
<body>

<h1>Test Music Player</h1>

<form id="searchForm">
    <input
        id="searchInput"
        type="text"
        placeholder="Search for a song..."
        autocomplete="off"
    >
    <button type="submit">Go</button>
</form>

<hr>

<h2>Search Results</h2>
<div id="results">Search for something.</div>

<hr>

<h2>Continue Listening</h2>
<div id="continueListening">Nothing here yet.</div>

<hr>

<h2>Now Playing</h2>

<img
    id="cover"
    width="200"
    height="200"
    alt=""
    style="display:none;"
>

<p id="nowPlaying">Nothing playing.</p>

<audio id="player" controls></audio>

<br><br>

<button id="back10">↶ 10s</button>
<button id="skipSong">Skip Song</button>
<button id="forward10">10s ↷</button>
<button id="stopSong">Stop</button>

<p id="status"></p>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

<script>
const SEARCH_API =
    "https://search.alxhlms.workers.dev/search";

const STREAM_API =
    "https://playback.alxhlms.workers.dev/stream";

const player = document.getElementById("player");
const results = document.getElementById("results");
const continueListening = document.getElementById("continueListening");
const nowPlaying = document.getElementById("nowPlaying");
const cover = document.getElementById("cover");
const statusText = document.getElementById("status");

let hls = null;
let currentTrack = null;
let searchResults = [];
let currentIndex = -1;


/*
 * SEARCH
 */

document.getElementById("searchForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const query = document.getElementById("searchInput").value.trim();

    if (!query) {
        return;
    }

    results.textContent = "Searching...";
    statusText.textContent = "";

    try {
        const response = await fetch(
            `${SEARCH_API}?q=${encodeURIComponent(query)}`
        );

        if (!response.ok) {
            throw new Error(`Search failed: HTTP ${response.status}`);
        }

        const data = await response.json();

        searchResults = data.results || [];

        renderResults();

    } catch (error) {
        console.error(error);
        results.textContent = "Search failed.";
        statusText.textContent = error.message;
    }
});


function renderResults() {
    results.innerHTML = "";

    if (!searchResults.length) {
        results.textContent = "No results.";
        return;
    }

    searchResults.forEach((track, index) => {
        const button = document.createElement("button");

        button.textContent =
            `${track.track_name} — ${track.artist_name}`;

        button.addEventListener("click", () => {
            playTrack(track, index);
        });

        const wrapper = document.createElement("div");

        wrapper.appendChild(button);
        results.appendChild(wrapper);
    });
}


/*
 * PLAYBACK
 */

async function playTrack(track, index = -1) {
    currentTrack = track;
    currentIndex = index;

    nowPlaying.textContent =
        `${track.track_name} — ${track.artist_name}`;

    statusText.textContent = "Loading...";

    if (track.cover_art_url) {
        cover.src = track.cover_art_url;
        cover.style.display = "block";
    } else {
        cover.style.display = "none";
    }

    saveContinueListening(track);

    const streamURL =
        `${STREAM_API}/${encodeURIComponent(track.unique_id)}`;

    stopHLS();

    /*
     * Native HLS support.
     * Safari/iOS may enter here.
     */

    if (player.canPlayType("application/vnd.apple.mpegurl")) {
        player.src = streamURL;

        try {
            await player.play();
            statusText.textContent = "Playing.";
        } catch (error) {
            console.error(error);
            statusText.textContent =
                "Loaded the stream, but playback needs user interaction.";
        }

        return;
    }

    /*
     * Chromium/Firefox/etc.
     * Use hls.js.
     */

    if (Hls.isSupported()) {
        hls = new Hls();

        hls.loadSource(streamURL);
        hls.attachMedia(player);

        hls.on(Hls.Events.MANIFEST_PARSED, async () => {
            try {
                await player.play();
                statusText.textContent = "Playing.";
            } catch (error) {
                console.error(error);
                statusText.textContent =
                    "Stream loaded. Press Play.";
            }
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
            console.error("HLS error:", data);

            if (data.fatal) {
                statusText.textContent =
                    `HLS error: ${data.type}`;
            }
        });

        return;
    }

    statusText.textContent =
        "This browser does not support HLS playback.";
}


function stopHLS() {
    if (hls) {
        hls.destroy();
        hls = null;
    }

    player.pause();
    player.removeAttribute("src");
    player.load();
}


/*
 * CONTINUE LISTENING
 */

function saveContinueListening(track) {
    const history = JSON.parse(
        localStorage.getItem("continueListening") || "[]"
    );

    const filtered = history.filter(
        item => item.unique_id !== track.unique_id
    );

    filtered.unshift({
        unique_id: track.unique_id,
        track_name: track.track_name,
        artist_name: track.artist_name,
        album_name: track.album_name,
        length_in_seconds: track.length_in_seconds,
        cover_art_url: track.cover_art_url
    });

    /*
     * Keep the last 10 tracks.
     */

    localStorage.setItem(
        "continueListening",
        JSON.stringify(filtered.slice(0, 10))
    );

    renderContinueListening();
}


function renderContinueListening() {
    const history = JSON.parse(
        localStorage.getItem("continueListening") || "[]"
    );

    continueListening.innerHTML = "";

    if (!history.length) {
        continueListening.textContent = "Nothing here yet.";
        return;
    }

    history.forEach(track => {
        const button = document.createElement("button");

        button.textContent =
            `${track.track_name} — ${track.artist_name}`;

        button.addEventListener("click", () => {
            playTrack(track);
        });

        const wrapper = document.createElement("div");

        wrapper.appendChild(button);
        continueListening.appendChild(wrapper);
    });
}


/*
 * 10 SECOND SEEK
 */

document.getElementById("back10").addEventListener("click", () => {
    if (!player.src) return;

    player.currentTime = Math.max(
        0,
        player.currentTime - 10
    );
});


document.getElementById("forward10").addEventListener("click", () => {
    if (!player.src) return;

    player.currentTime = Math.min(
        player.duration || Infinity,
        player.currentTime + 10
    );
});


/*
 * SKIP SONG
 */

document.getElementById("skipSong").addEventListener("click", () => {
    if (
        currentIndex >= 0 &&
        currentIndex + 1 < searchResults.length
    ) {
        playTrack(
            searchResults[currentIndex + 1],
            currentIndex + 1
        );
    } else {
        stopPlayback();
        statusText.textContent = "No next song.";
    }
});


/*
 * STOP
 */

document.getElementById("stopSong").addEventListener("click", () => {
    stopPlayback();
});


function stopPlayback() {
    stopHLS();

    currentTrack = null;
    currentIndex = -1;

    nowPlaying.textContent = "Nothing playing.";
    statusText.textContent = "Stopped.";
}


/*
 * AUTOMATICALLY GO TO NEXT SONG
 */

player.addEventListener("ended", () => {
    if (
        currentIndex >= 0 &&
        currentIndex + 1 < searchResults.length
    ) {
        playTrack(
            searchResults[currentIndex + 1],
            currentIndex + 1
        );
    }
});


/*
 * INITIAL LOAD
 */

renderContinueListening();

</script>

</body>
</html>
