<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player Test</title>
</head>

<body>

<h1>Music Player Test</h1>

<form id="searchForm">
    <input
        id="searchInput"
        type="text"
        placeholder="Search..."
        autocomplete="off"
    >
    <button type="submit">Go</button>
</form>

<hr>

<h2>Search Results</h2>
<div id="results">Search for a song.</div>

<hr>

<h2>Continue Listening</h2>
<div id="continueListening">Nothing here yet.</div>

<hr>

<h2>Now Playing</h2>

<img
    id="cover"
    width="200"
    height="200"
    alt="Album cover"
    style="display:none;"
>

<p id="nowPlaying">Nothing playing.</p>

<audio
    id="player"
    controls
    preload="none"
></audio>

<br><br>

<button id="back10">↶ 10 seconds</button>
<button id="skipSong">Skip Song</button>
<button id="forward10">10 seconds ↷</button>
<button id="stopSong">Stop</button>

<p id="status"></p>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

<script>

const SEARCH_API =
    "https://search.alxhlms.workers.dev/search";

const STREAM_API =
    "https://playback.alxhlms.workers.dev/stream";

const player =
    document.getElementById("player");

const results =
    document.getElementById("results");

const continueListening =
    document.getElementById("continueListening");

const nowPlaying =
    document.getElementById("nowPlaying");

const cover =
    document.getElementById("cover");

const statusText =
    document.getElementById("status");

let hls = null;
let currentTrack = null;
let currentIndex = -1;
let searchResults = [];


/* =========================
   SEARCH
========================= */

document
    .getElementById("searchForm")
    .addEventListener("submit", async (event) => {

        event.preventDefault();

        const query =
            document
                .getElementById("searchInput")
                .value
                .trim();

        if (!query) {
            return;
        }

        results.textContent = "Searching...";
        statusText.textContent = "";

        const url =
            `${SEARCH_API}?q=${encodeURIComponent(query)}`;

        console.log("Search URL:", url);

        try {

            const response =
                await fetch(url);

            console.log(
                "Search status:",
                response.status
            );

            if (!response.ok) {
                throw new Error(
                    `Search returned HTTP ${response.status}`
                );
            }

            const data =
                await response.json();

            console.log(
                "Search response:",
                data
            );

            searchResults =
                data.results || [];

            renderResults();

        } catch (error) {

            console.error(
                "Search failed:",
                error
            );

            results.textContent =
                "Search failed.";

            statusText.textContent =
                error.message;
        }
    });


function renderResults() {

    results.innerHTML = "";

    if (!searchResults.length) {

        results.textContent =
            "No results.";

        return;
    }

    searchResults.forEach((track, index) => {

        const wrapper =
            document.createElement("div");

        const button =
            document.createElement("button");

        button.textContent =
            `${track.track_name} — ${track.artist_name}`;

        button.addEventListener(
            "click",
            () => playTrack(track, index)
        );

        wrapper.appendChild(button);

        results.appendChild(wrapper);
    });
}


/* =========================
   PLAY TRACK
========================= */

async function playTrack(
    track,
    index = -1
) {

    currentTrack = track;
    currentIndex = index;

    nowPlaying.textContent =
        `${track.track_name} — ${track.artist_name}`;

    statusText.textContent =
        "Getting stream information...";

    if (track.cover_art_url) {

        cover.src =
            track.cover_art_url;

        cover.style.display =
            "block";

    } else {

        cover.style.display =
            "none";
    }

    saveContinueListening(track);

    destroyHLS();


    try {

        /*
         * IMPORTANT:
         *
         * /stream/{id} returns JSON metadata.
         * It is NOT the HLS playlist itself.
         */

        const infoURL =
            `${STREAM_API}/${encodeURIComponent(track.unique_id)}`;

        console.log(
            "Fetching stream information:",
            infoURL
        );

        const response =
            await fetch(infoURL);

        console.log(
            "Stream info status:",
            response.status
        );

        if (!response.ok) {

            throw new Error(
                `Stream API returned HTTP ${response.status}`
            );
        }

        const data =
            await response.json();

        console.log(
            "Stream information:",
            data
        );


        /*
         * The API provides the browser-oriented
         * playback endpoint here.
         */

        const streamURL =
            data.player_stream_url;

        if (!streamURL) {

            throw new Error(
                "API did not return player_stream_url"
            );
        }

        console.log(
            "Player stream URL:",
            streamURL
        );

        statusText.textContent =
            "Loading HLS...";


        /*
         * Native HLS
         */

        if (
            player.canPlayType(
                "application/vnd.apple.mpegurl"
            )
        ) {

            player.src =
                streamURL;

            try {

                await player.play();

                statusText.textContent =
                    "Playing.";

            } catch (error) {

                console.error(
                    "Native playback:",
                    error
                );

                statusText.textContent =
                    "Ready. Press Play.";
            }

            return;
        }


        /*
         * HLS.js
         */

        if (
            window.Hls &&
            Hls.isSupported()
        ) {

            hls =
                new Hls({

                    /*
                     * Keep retries low while debugging
                     * so one failure doesn't hammer
                     * the Worker.
                     */

                    manifestLoadingMaxRetry: 1,
                    levelLoadingMaxRetry: 1,
                    fragLoadingMaxRetry: 1
                });


            hls.on(
                Hls.Events.MANIFEST_LOADING,
                (event, data) => {

                    console.log(
                        "Loading manifest:",
                        data.url
                    );
                }
            );


            hls.on(
                Hls.Events.MANIFEST_LOADED,
                (event, data) => {

                    console.log(
                        "Manifest loaded:",
                        data
                    );
                }
            );


            hls.on(
                Hls.Events.MANIFEST_PARSED,
                async () => {

                    console.log(
                        "HLS manifest parsed."
                    );

                    statusText.textContent =
                        "Ready.";

                    try {

                        await player.play();

                        statusText.textContent =
                            "Playing.";

                    } catch (error) {

                        console.log(
                            "Autoplay prevented:",
                            error
                        );

                        statusText.textContent =
                            "Ready. Press Play.";
                    }
                }
            );


            hls.on(
                Hls.Events.FRAG_LOADING,
                (event, data) => {

                    console.log(
                        "Loading HLS fragment:",
                        data.frag?.url
                    );
                }
            );


            hls.on(
                Hls.Events.ERROR,
                (event, data) => {

                    console.error(
                        "HLS ERROR:",
                        data
                    );

                    console.error(
                        "HLS ERROR TYPE:",
                        data.type
                    );

                    console.error(
                        "HLS ERROR DETAILS:",
                        data.details
                    );

                    console.error(
                        "HLS ERROR URL:",
                        data.url
                    );


                    if (data.fatal) {

                        statusText.textContent =
                            `HLS error: ${data.type} / ${data.details}`;

                    }
                }
            );


            /*
             * Start loading the HLS playlist.
             */

            hls.loadSource(
                streamURL
            );

            hls.attachMedia(
                player
            );

            return;
        }


        throw new Error(
            "This browser does not support HLS playback."
        );


    } catch (error) {

        console.error(
            "Playback failed:",
            error
        );

        statusText.textContent =
            `Playback failed: ${error.message}`;
    }
}


/* =========================
   DESTROY HLS
========================= */

function destroyHLS() {

    if (hls) {

        hls.destroy();

        hls = null;
    }

    player.pause();

    player.removeAttribute("src");

    player.load();
}


/* =========================
   STOP
========================= */

document
    .getElementById("stopSong")
    .addEventListener(
        "click",
        () => {

            stopPlayback();
        }
    );


function stopPlayback() {

    destroyHLS();

    currentTrack = null;
    currentIndex = -1;

    nowPlaying.textContent =
        "Nothing playing.";

    statusText.textContent =
        "Stopped.";
}


/* =========================
   BACK 10 SECONDS
========================= */

document
    .getElementById("back10")
    .addEventListener(
        "click",
        () => {

            if (
                !Number.isFinite(
                    player.currentTime
                )
            ) {
                return;
            }

            player.currentTime =
                Math.max(
                    0,
                    player.currentTime - 10
                );
        }
    );


/* =========================
   FORWARD 10 SECONDS
========================= */

document
    .getElementById("forward10")
    .addEventListener(
        "click",
        () => {

            if (
                !Number.isFinite(
                    player.currentTime
                )
            ) {
                return;
            }

            const duration =
                Number.isFinite(
                    player.duration
                )
                    ? player.duration
                    : Infinity;

            player.currentTime =
                Math.min(
                    duration,
                    player.currentTime + 10
                );
        }
    );


/* =========================
   SKIP SONG
========================= */

document
    .getElementById("skipSong")
    .addEventListener(
        "click",
        () => {

            if (
                currentIndex >= 0 &&
                currentIndex + 1 <
                    searchResults.length
            ) {

                playTrack(
                    searchResults[
                        currentIndex + 1
                    ],
                    currentIndex + 1
                );

            } else {

                stopPlayback();

                statusText.textContent =
                    "No next song.";
            }
        }
    );


/* =========================
   AUTO NEXT SONG
========================= */

player.addEventListener(
    "ended",
    () => {

        if (
            currentIndex >= 0 &&
            currentIndex + 1 <
                searchResults.length
        ) {

            playTrack(
                searchResults[
                    currentIndex + 1
                ],
                currentIndex + 1
            );
        }
    }
);


/* =========================
   CONTINUE LISTENING
========================= */

function saveContinueListening(track) {

    let history = [];

    try {

        history =
            JSON.parse(
                localStorage.getItem(
                    "continueListening"
                ) || "[]"
            );

    } catch {

        history = [];
    }


    /*
     * Remove duplicate.
     */

    history =
        history.filter(
            item =>
                item.unique_id !==
                track.unique_id
        );


    /*
     * Store metadata only.
     */

    history.unshift({

        unique_id:
            track.unique_id,

        track_name:
            track.track_name,

        artist_name:
            track.artist_name,

        album_name:
            track.album_name,

        length_in_seconds:
            track.length_in_seconds,

        cover_art_url:
            track.cover_art_url
    });


    /*
     * Keep the newest 10.
     */

    history =
        history.slice(0, 10);


    localStorage.setItem(
        "continueListening",
        JSON.stringify(history)
    );


    renderContinueListening();
}


function renderContinueListening() {

    let history = [];

    try {

        history =
            JSON.parse(
                localStorage.getItem(
                    "continueListening"
                ) || "[]"
            );

    } catch {

        history = [];
    }


    continueListening.innerHTML = "";


    if (!history.length) {

        continueListening.textContent =
            "Nothing here yet.";

        return;
    }


    history.forEach(
        (track) => {

            const wrapper =
                document.createElement("div");

            const button =
                document.createElement("button");

            button.textContent =
                `${track.track_name} — ${track.artist_name}`;

            button.addEventListener(
                "click",
                () => playTrack(track)
            );

            wrapper.appendChild(button);

            continueListening.appendChild(
                wrapper
            );
        }
    );
}


/* =========================
   INITIALIZE
========================= */

renderContinueListening();

</script>

</body>
</html>
